[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arducam-photo-v2"
version = "2.0.0"
description = "Application locale de capture Arducam B0494C"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "PySide6-Essentials>=6.7,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
arducam-photo-v2 = "arducam_photo_v2.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
